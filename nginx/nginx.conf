# 1. REDIRECIONAMENTO: HTTP (80) -> HTTPS (443)
server {
    listen       80;
    server_name  _;
    return 301 https://$host$request_uri;
}

# 2. SERVIDOR PRINCIPAL: HTTPS (443)
server {
    listen       443 ssl;
    server_name  _;

    # Caminho dos certificados dentro do contêiner Linux do NGINX
    ssl_certificate      /etc/nginx/certs/localhost+2.pem;
    ssl_certificate_key  /etc/nginx/certs/localhost+2-key.pem;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # 🛡️ CABEÇALHOS DE SEGURANÇA HTTP (Diretivas Básicas)
    
    # Proteção contra Clickjacking: Impede que o app seja renderizado dentro de <frame>, <iframe> ou <embed> de outros sites
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Proteção contra Farejamento de Tipo (MIME Sniffing): Força o navegador a respeitar o Content-Type enviado pela API
    add_header X-Content-Type-Options "nosniff" always;

    # Filtro de Cross-Site Scripting antigo (Mapeado para navegadores legados como barreira extra)
    add_header X-XSS-Protection "1; mode=block" always;

    # Content Security Policy (CSP) básica: Permite scripts e conexões apenas do próprio domínio ('self') e do backend/WSS do ecossistema
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:;" always;

    # Proxy Reverso: Encaminha TUDO direto para o contêiner da sua API Node
    location / {
        proxy_pass http://backend:8085; # Usa o nome do serviço definido no docker-compose
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_cache_bypass $http_upgrade;
    }
}