# 1. REDIRECIONAMENTO: HTTP (80) -> HTTPS (443)
server {
    listen       80;
    server_name  _;
    return 301 https://$host$request_uri;
}

# 2. SERVIDOR PRINCIPAL: HTTPS (443)
server {
    listen       443 ssl;
    server_name  _;

    # Caminho dos certificados dentro do contêiner Linux do NGINX
    ssl_certificate      /etc/nginx/certs/localhost+2.pem;
    ssl_certificate_key  /etc/nginx/certs/localhost+2-key.pem;

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # Proxy Reverso: Encaminha TUDO direto para o contêiner da sua API Node
    location / {
        proxy_pass http://backend:8085; # Usa o nome do serviço definido no docker-compose
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_cache_bypass $http_upgrade;
    }
}
