# =====================================================================
# NGINX - PROXY REVERSO DO MOOVE (montado como /etc/nginx/conf.d/default.conf)
# Responsabilidades: TLS, roteamento para o back-end, WebSocket, rate limit,
# Correlation ID, cabeçalhos de segurança e logs de acesso em JSON.
# =====================================================================

# Pool de back-ends (permite escalar horizontalmente: basta adicionar "server backend2:8085;")
upstream moove_backend {
    server backend:8085 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Upgrade de conexão apenas quando o cliente pede WebSocket; nos demais casos mantém keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Correlation ID: reaproveita o X-Request-Id do App ou gera um novo
map $http_x_request_id $id_requisicao {
    default $http_x_request_id;
    ''      $request_id;
}

# Proteção contra abuso: 20 req/s por IP (rajadas de até 40)
limit_req_zone $binary_remote_addr zone=api_limite:10m rate=20r/s;

# Logs de acesso estruturados (mesmo formato JSON do back-end)
log_format moove_json escape=json
    '{"time":"$time_iso8601","servico":"moove-nginx","idRequisicao":"$id_requisicao",'
    '"ip":"$remote_addr","metodo":"$request_method","url":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"duracaoSeg":$request_time,"upstreamSeg":"$upstream_response_time",'
    '"userAgent":"$http_user_agent"}';

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost+2.pem;
    ssl_certificate_key /etc/nginx/certs/localhost+2-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log moove_json;

    client_max_body_size 10m;   # upload de logos de empresas (multer)
    server_tokens off;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-Id $id_requisicao always;
    # Um único X-Request-Id na resposta (o do Nginx) e o mesmo valor repassado
    # aos serviços também nas rotas de health/metrics -> logs correlacionáveis.
    proxy_hide_header X-Request-Id;
    proxy_set_header X-Request-Id $id_requisicao;

    # Timeouts para não prender conexões quando o back-end estiver lento
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------------------------------------------------------------
    # Health check público (sem bloqueio, sem log para não gerar ruído)
    # ---------------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://moove_backend/health;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://moove_backend/health/ready;
    }

    # Métricas apenas para a rede interna do Docker / host (Prometheus)
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://moove_backend/metrics;
    }

    # ---------------------------------------------------------------
    # 🧾 MICROSSERVIÇO DE AUDITORIA (roteamento por prefixo)
    # Resolução DINÂMICA via DNS do Docker: se o serviço estiver fora,
    # só /auditoria responde 502 - o Nginx e o restante da API seguem no ar.
    # ---------------------------------------------------------------
    location = /auditoria/metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $servico_auditoria http://auditoria:8090;
        proxy_pass $servico_auditoria;
    }

    location ^~ /auditoria/ {
        limit_req zone=api_limite burst=40 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $servico_auditoria http://auditoria:8090;
        proxy_pass $servico_auditoria;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $id_requisicao;
        proxy_set_header Authorization $http_authorization;
    }

    # 🔒 SISTEMA DE BLOQUEIO DE ACESSO DIRETO VIA BARRA DE ENDEREÇO
    location / {
        limit_req zone=api_limite burst=40 nodelay;
        limit_req_status 429;

        set $bloquear "";

        # Se o usuário tentou acessar digitando diretamente na URL (navigate), marcamos para bloqueio
        if ($http_sec_fetch_mode = "navigate") {
            set $bloquear "S";
        }

        # Liberamos o acesso se a requisição veio do Frontend Oficial (Porta 8081 do Expo/Metro, domínios ou IP local)
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|10\.185\.127\.105|seudominio\.com)(:8081)?$") {
            set $bloquear "";
        }
        if ($http_referer ~* "^https?://(localhost|127\.0\.0\.1|10\.185\.127\.105|seudominio\.com)(:8081)?") {
            set $bloquear "";
        }

        # Se o host acessado for o próprio IP local ou localhost, NÃO bloqueamos o acesso direto
        if ($host = "10.185.127.105") {
            set $bloquear "";
        }
        if ($host = "localhost") {
            set $bloquear "";
        }
        if ($host = "127.0.0.1") {
            set $bloquear "";
        }

        # Navegação direta externa que NÃO veio do frontend é barrada
        if ($bloquear = "S") {
            return 403;
        }

        # PROXY REVERSO: encaminha para o container do Node
        proxy_pass http://moove_backend;
        proxy_http_version 1.1;

        # WebSocket (Baileys / tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $id_requisicao;

        proxy_cache_bypass $http_upgrade;
    }
}
