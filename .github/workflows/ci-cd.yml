# =====================================================================
# PIPELINE CI/CD - MOOVE
#   build -> test -> docker (imagens) -> deploy (manual/aprovação, só main)
# Docs: docs/05-entrega-continua/pipeline-ci-cd.md
# =====================================================================
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # -------------------------------------------------------------------
  # 1. BUILD + TESTES DO BACK-END
  # -------------------------------------------------------------------
  backend:
    name: Back-end (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsappBot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Necessário se os submódulos forem privados
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: whatsappBot/package-lock.json

      - name: Instalar dependências
        run: npm ci || npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários (cache-aside, Pub/Sub, resiliência)
        run: npm run test:ci

      - name: Build (TypeScript -> dist)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: whatsappBot/dist
          retention-days: 7

  # -------------------------------------------------------------------
  # 1.1 MICROSSERVIÇO DE AUDITORIA (pipeline independente do monólito)
  # -------------------------------------------------------------------
  auditoria:
    name: Microsserviço auditoria (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditoria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependências
        run: npm ci || npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (service, consumidor Pub/Sub, API)
        run: npm run test:ci
      - name: Build
        run: npm run build

  # -------------------------------------------------------------------
  # 2. VERIFICAÇÃO DO APP MOBILE
  # -------------------------------------------------------------------
  frontend:
    name: App mobile (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jcha_app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: jcha_app/package-lock.json
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  # -------------------------------------------------------------------
  # 3. IMAGENS DOCKER + VALIDAÇÃO DA INFRA
  # -------------------------------------------------------------------
  docker:
    name: Docker (build de imagens e validação do compose)
    runs-on: ubuntu-latest
    needs: [backend, auditoria, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Criar .env de CI a partir do modelo
        run: cp .env.example .env

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Validar sintaxe do Nginx
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

      - name: Build da imagem do back-end
        run: docker build -t moove-backend:${{ github.sha }} -f whatsappBot/Dockerfile.backend whatsappBot

      - name: Build da imagem do microsserviço de auditoria
        run: docker build -t moove-auditoria:${{ github.sha }} auditoria

      # Publicação no registry (GHCR) apenas na main
      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem versionada (tag = SHA do commit)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/moove-backend
          IMG=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          docker tag moove-backend:${{ github.sha }} $IMG:${{ github.sha }}
          docker tag moove-backend:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
          AUD=$(echo "ghcr.io/${{ github.repository_owner }}/moove-auditoria" | tr '[:upper:]' '[:lower:]')
          docker tag moove-auditoria:${{ github.sha }} $AUD:${{ github.sha }}
          docker tag moove-auditoria:${{ github.sha }} $AUD:latest
          docker push $AUD:${{ github.sha }}
          docker push $AUD:latest

  # -------------------------------------------------------------------
  # 4. DEPLOY (esqueleto) - estratégia: recreate + rollback automático
  #    Ver docs/adr/0006-estrategia-de-deploy.md
  # -------------------------------------------------------------------
  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: producao          # exige aprovação manual configurada no GitHub (Settings > Environments)
    env:
      # secrets não podem ser usados direto em "if:", por isso viram variável do job
      TEM_SERVIDOR: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (esqueleto)
        if: env.TEM_SERVIDOR == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/app-moove
            git pull --recurse-submodules
            ./scripts/deploy.sh ${{ github.sha }} auditoria   # microsserviço primeiro (não afeta o bot)
            ./scripts/deploy.sh ${{ github.sha }} backend

      - name: Aviso (secrets não configurados)
        if: env.TEM_SERVIDOR != 'true'
        run: echo "::notice::Deploy ignorado - configure DEPLOY_HOST, DEPLOY_USER e DEPLOY_SSH_KEY."
